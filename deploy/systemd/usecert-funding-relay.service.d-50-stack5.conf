[Service]
# STACK 5. Installed as /etc/systemd/system/usecert-funding-relay.service.d/50-stack5.conf by
# `usecert-s5-cutover funding-relay`. The relay relays the stack-5 vaults only (their keeper
# configs, /opt/keeper/vaults/s5-*.json) with a state file of their own; a later Environment=
# assignment of the same variable overrides the unit's.
Environment=FUNDING_RELAY_VAULTS=/opt/keeper/vaults/s5-*.json
Environment=FUNDING_RELAY_STATE=/opt/keeper/funding-relay-state-s5.json
