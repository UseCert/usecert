[Service]
# STACK 5 ONLY (pre-audit H-4). Drop into /etc/systemd/system/usecert-keeper@.service.d/ when
# the keepers move to stack-5 vaults, never before: a stack-4 vault settles only from the
# attester, and would revert every settlement made with the settler key.
#
# settler.env holds KEEPER_SETTLER_PK (root-only, like attester.env). With STACK=5 the keeper
# reads only that key, refuses to start if it equals the attester key or does not derive the
# vault's settler(), and drops KEEPER_ATTESTER_PK from its environment - attester.env can stay
# loaded by the base unit for stack-4 instances; a stack-5 keeper never uses it.
Environment=STACK=5
EnvironmentFile=/etc/usecert-keeper/settler.env
