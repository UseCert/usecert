[Service]
# STACK 5 ONLY (pre-audit H-4). Installed per INSTANCE, never for the template, by
#   usecert-s5-cutover keeper-configs
# as /etc/systemd/system/usecert-keeper@s5-<sym>.service.d/50-stack5-settler.conf. In the template
# directory it would reach the stack-4 instances too, and a stack-4 vault settles only from the
# attester: every settlement made with the settler key would revert.
#
# The settler key: KEEPER_SETTLER_PK from settler.env (root-only, like attester.env) if that file
# exists, else the vault config's "settler_key_file" (/opt/keeper/keys/s5-settler.key, as the kit
# writes it). The kit refuses to install while settler.env exists, so there is one source only.
# With STACK=5 the keeper reads only the settler key, refuses to start if it equals the attester
# key or does not derive the vault's settler(), and drops KEEPER_ATTESTER_PK from its environment.
Environment=STACK=5
EnvironmentFile=-/etc/usecert-keeper/settler.env
