# Installed when the stack-5 attester rotation is accepted (runbook: key separation): the relay
# keeps reading the vault accounts' funding records here and asks Montreal to send each delta,
# which Montreal re-checks against the public funding before signing with the stack-5 attester.
[Service]
Environment=FUNDING_RELAY_REMOTE=settle-intake@148.113.237.230
Environment=FUNDING_RELAY_SSH_KEY=/opt/keeper/keys/settle_ed25519
Environment=FUNDING_RELAY_KNOWN_HOSTS=/opt/keeper/keys/settle_known_hosts
