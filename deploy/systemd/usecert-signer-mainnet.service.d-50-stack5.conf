[Service]
# SITE CUTOVER ONLY. Installed as /etc/systemd/system/usecert-signer-mainnet.service.d/50-stack5.conf
# by `usecert-s5-cutover signer-cutover --switch`, removed by `--rollback`. With it the signer on
# 127.0.0.1:8787 (the site's /api/attestations) signs for the stack-5 book with v2 marks; without
# it the unit is exactly what it was (stack 4). Same attester key (attester.env), same user.
Environment=STACK=5
Environment=MARK_SIG_VERSION=2
Environment=OI_SOURCE=venue
Environment=SANITY_CHECKS=1
Environment=MULTIPLIER_CHECKS=1
ExecStart=
ExecStart=/bin/sh -c 'ATTESTER_PK="$KEEPER_ATTESTER_PK" exec /opt/keeper/venv/bin/python /opt/keeper/usecert-signer-mainnet-s5.py /opt/keeper/book-stack5.json'
