[Service]
# STACK 5 ONLY. Installed per instance (usecert-keeper@s5-<sym>) by usecert-s5-cutover
# keeper-configs, beside 50-stack5-settler.conf. The stack-5 keepers run the stack-5 keeper
# (/opt/keeper/usecert-keeper-s5.py, copied from deploy/bin/usecert-keeper.py at the audited
# commit); the stack-4 instances keep running /opt/keeper/usecert-keeper.py, untouched.
ExecStartPre=
ExecStartPre=/opt/keeper/venv/bin/python -m py_compile /opt/keeper/usecert-keeper-s5.py
ExecStart=
ExecStart=/opt/keeper/venv/bin/python /opt/keeper/usecert-keeper-s5.py /opt/keeper/vaults/%i.json
