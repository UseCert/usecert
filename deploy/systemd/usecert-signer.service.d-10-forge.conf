[Service]
# forge lives in /home/usecert/.foundry/bin, which ProtectHome=yes hides entirely -
# the service died with "spawn forge EACCES". read-only is the narrowest setting
# that still lets the binary be executed, and HOME is redirected to a writable path
# under /opt so forge has somewhere for its cache without /home being writable.
ProtectHome=read-only
Environment=HOME=/opt/usecert/.signer-home
Environment=FOUNDRY_CACHE_DIR=/opt/usecert/.signer-home/cache
ReadWritePaths=/opt/usecert/.signer-home
