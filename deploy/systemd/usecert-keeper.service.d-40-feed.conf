[Service]
# FEED MARGIN. Separate from 20-tick.conf on purpose: that drop-in reasoned about the
# ATTESTER's 300s budget when the tick moved 30s -> 120s, and nobody redid the arithmetic
# for the FEED's 900s budget. The feed quietly lost its entire failure tolerance.
#
# Measured on 2026-09-23, not assumed - consecutive uNVDA pushes on the explorer:
#   568s 569s 568s 566s 567s 557s   then  1104s
# The cycle is ~567s of wall clock, not the nominal FEED_EVERY*TICK of 480s: four forge
# scripts plus the batch advancer add about 87s per pass. Against stalenessSeconds=900
# that leaves 333s of headroom - less than one cycle, so ONE dropped push breaches. That
# is precisely what happened: a single transient broadcast failure, a 1104s gap, px()
# reverting CertOracle_StalePrice, and mintAllowed() false on uNVDA.
#
# At FEED_EVERY=3 the cycle is ~425s and two consecutive cycles are ~850s, still inside
# 900s - so the feed absorbs one complete failure, retry included, instead of none.
#
# Cost: ~101k gas per push, four mirrors, at 0.02 gwei. 0.00123 -> 0.00164 ETH/day, an
# extra 0.0004 ETH/day for a failure budget that currently does not exist.
Environment=FEED_EVERY=3
