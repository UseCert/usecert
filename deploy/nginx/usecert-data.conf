# /data/history.json: the dashboard's solvency and funding history, written every 5 minutes by
# deploy/bin/usecert-history. Same-origin, so CSP connect-src 'self' already covers it. The
# security headers are re-included because an add_header here drops the server-level ones.
location = /data/history.json {
    alias /var/www/usecert-data/history.json;
    default_type application/json;
    gzip on;
    gzip_types application/json;
    include /etc/nginx/snippets/usecert-security-headers.conf;
    add_header Cache-Control "public, max-age=60" always;
}
location ^~ /data/ { return 404; }

# Paths people type looking for documentation (they were 404s in the access log). 302, not
# 301: if a real /docs page is written later, browsers must not have cached the redirect.
location = /docs       { return 302 /learn; }
location = /whitepaper { return 302 /learn; }
location = /tokenomics { return 302 /roles; }
