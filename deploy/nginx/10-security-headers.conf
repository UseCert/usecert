# Security headers for use-cert.com.
#
# WHY THIS FILE EXISTS. The launch-readiness audit of 2026-09-25 reported "no source-controlled
# CSP, HSTS, anti-framing policy, MIME-sniffing protection, referrer policy, or permissions
# policy for the wallet site". Half of that was wrong about the LIVE site - HSTS, nosniff,
# X-Frame-Options and Referrer-Policy were already being served - and entirely right about the
# repository, which is the part that matters. A header that exists only in a file on one host is
# one `nginx -t` away from being lost with nothing to restore it from.
#
# Include this from every server block that serves the app:
#     include /etc/nginx/snippets/usecert-security-headers.conf;
#
# `always` on every header, so they are present on error responses too. Without it nginx omits
# add_header on 4xx/5xx, which is exactly where a framed error page would be most useful to an
# attacker.

# --------------------------------------------------------------------------- transport
# includeSubDomains covers monitor.use-cert.com. `preload` is deliberately NOT set: it is a
# one-way door enforced by browser vendors and should be a decision, not a side effect of a
# config change.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --------------------------------------------------------------------------- content
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# X-Frame-Options is superseded by CSP frame-ancestors but is kept for older browsers, which
# are exactly the ones a wallet user is most at risk on. The two agree: no framing at all.
add_header X-Frame-Options "DENY" always;

# Explicitly 0, not 1. The legacy XSS auditor introduced its own vulnerabilities and every
# current browser has removed it; 1 asks a browser to re-enable something it should not.
add_header X-XSS-Protection "0" always;

# --------------------------------------------------------------------------- capabilities
# Deny everything the site does not use. A wallet page has no business asking for a camera, a
# microphone, a location, or the Payment Request API - and if it ever starts, that should be a
# visible change to this line rather than a silent capability it already had.
# ambient-light-sensor, battery and document-domain were in this list and are dropped:
# current browsers do not recognise them and log a warning for each, which trains an operator
# to ignore a console that should be empty. A policy nobody reads protects nothing.
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()" always;

# --------------------------------------------------------------------------- CSP
#
# Each source is here because something measurably needs it:
#
#   fonts.googleapis.com   the stylesheet
#   fonts.gstatic.com      the font files it references
#   rpc.testnet…           every contract read and write
#   explorer.testnet…      useFlows reads the Blockscout REST index directly, no proxy
#
# 'unsafe-inline' on script-src is a real weakening and is not pretended otherwise. This is a
# server-rendered TanStack Start app whose hydration payload is an inline script; removing it
# needs per-request nonces threaded through the SSR response, which is a build change rather
# than a config one. It is recorded as open work rather than quietly accepted.
#
# 'unsafe-eval' is NOT granted. If a wallet connector ever needs it, the failure will be loud
# in the console and the decision can be made deliberately.
#
# frame-ancestors 'none' is the one that matters most here: it is what stops a clickjacking
# frame around a page that asks people to sign transactions.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://rpc.testnet.chain.robinhood.com https://explorer.testnet.chain.robinhood.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests" always;
