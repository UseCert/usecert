# Rate, connection and telemetry definitions for the attestation signer's public door.
#
# Install to /etc/nginx/conf.d/20-signer-limits.conf. These must live in the HTTP context -
# a zone cannot be declared inside a server or location - which is why the signer's policy is
# split across two files. The route itself is usecert-api-attestations.conf.
#
# WHY THIS FILE EXISTS. Both the launch-readiness audit (2026-09-25) and the corrective
# re-audit that followed it named /api/attestations as load-bearing and unversioned: the route
# worked, and nothing in the repository proved the client and the signer were connected, or
# said what protected the endpoint. It was one `nginx -t` away from being gone with nothing to
# restore it from - the same gap the security-header policy had, and closed the same way.
#
# WHAT THE ENDPOINT IS. The attester signs off chain and never broadcasts; any caller may relay
# a signature. So the signatures are PUBLIC by design and there is nothing here to authenticate
# - a signature is useless to anyone unwilling to pay the gas to relay it, and the entire
# on-demand design depends on any minter being able to fetch one. The threat model is therefore
# availability, not confidentiality: the endpoint must survive being hammered, and must fail in
# a way a client can act on.

# --------------------------------------------------------------------------- per-IP budget
# Signatures are valid for 60 seconds, so a client that is throttled into relaying an expired
# one has been made worse off than a client that was refused outright. The budget is set well
# above what minting needs: one mint reads the endpoint ONCE, and the dashboard polls it on a
# slow timer. 10 r/s sustained with a burst of 30 is roughly two orders of magnitude above a
# real user and still bounds a single source.
limit_req_zone $binary_remote_addr zone=signer_ip:10m rate=10r/s;

# --------------------------------------------------------------------------- global ceiling
# A per-IP limit alone does not protect the signer from a distributed flood, and the signer is
# a single Node process holding a key. $server_name is a constant here, so this is one bucket
# for the whole endpoint: a hard ceiling on what reaches the upstream at all.
limit_req_zone $server_name zone=signer_all:1m rate=200r/s;

# Concurrency, separately from rate: slow readers holding connections open is a different
# attack from sending many requests, and a rate limit does not bound it.
limit_conn_zone $binary_remote_addr zone=signer_conn:10m;

# --------------------------------------------------------------------------- status codes
# 429, deliberately. The nginx default for a rejected request is 503, which tells a client the
# SERVICE is unavailable when what actually happened is that this client asked too often - the
# difference between "stop" and "slow down", and between a client that backs off and one that
# retries into the same wall. It matters more here than usual, because 503 is also what this
# endpoint returns when the signer really is down, and those must not be the same answer.
#
# `limit_req_status` is NOT set here: 00-hardening.conf already sets it to 429 for the whole
# server, and a second declaration is a hard `nginx -t` failure rather than an override. Set
# only the connection one, which nothing else declares.
limit_conn_status 429;

# --------------------------------------------------------------------------- telemetry
# The re-audit asked for recorded request/error/latency telemetry. Upstream time is separated
# from total time: a slow response from the signer and a slow client are different incidents
# and the combined number cannot distinguish them.
log_format usecert_signer '$time_iso8601 $remote_addr $status $request_method $uri '
                          'rt=$request_time urt=$upstream_response_time '
                          'len=$body_bytes_sent ref="$http_referer" ua="$http_user_agent"';
