# The attestation signer's public door.
#
# Install to /etc/nginx/snippets/usecert-api-attestations.conf and include it from the
# use-cert.com server block:
#
#     include /etc/nginx/snippets/usecert-api-attestations.conf;
#
# It needs the zones and log format from deploy/nginx/20-signer-limits.conf, which must be
# installed to /etc/nginx/conf.d/ first - nginx -t will name the missing zone otherwise.
#
# This file holds BOTH the route and its failure path, because a named location is a
# server-context directive and splitting them would put half the behaviour out of the
# repository again, which is the thing being fixed.

# --------------------------------------------------------------------------------- the route
location = /api/attestations {

    # ------------------------------------------------------------------- method allowlist
    # The upstream is read-only; nothing here has a side effect. `limit_except` would answer
    # 403, which says "you may not", when the true answer is "this endpoint does not do that".
    # A 405 is the one a client can act on, and `return` is the one use of `if` in a location
    # that is not a trap.
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }

    # Same-origin, so no CORS preflight is needed and none is answered. OPTIONS is allowed
    # only so that a client asking politely gets a real answer instead of an error, and it is
    # answered HERE rather than forwarded: the signer should not be woken to say nothing.
    if ($request_method = OPTIONS) { return 204; }

    # ------------------------------------------------------------------- budgets
    # nodelay on both: queueing a request for a 60-second signature is worse than refusing it,
    # because a delayed response can arrive already expired and be relayed into a revert.
    limit_req  zone=signer_ip  burst=30  nodelay;
    limit_req  zone=signer_all burst=200 nodelay;
    limit_conn signer_conn 12;

    # A GET with a body is malformed for this endpoint. Bound it rather than stream it.
    client_max_body_size 1k;
    client_body_timeout 5s;

    # ------------------------------------------------------------------- upstream
    # LOOPBACK ONLY. The signer binds 127.0.0.1:8787 and holds the attester key; this nginx
    # location is its only public door. Verify with `ss -ltnp | grep 8787` - if it ever shows
    # 0.0.0.0, the door has been bypassed and the limits above protect nothing.
    proxy_pass http://127.0.0.1:8787/attestations;
    proxy_http_version 1.1;

    # Nothing upstream reads a request body, so do not forward one.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Short, because the answer is short-lived. The signer builds a batch in milliseconds; a
    # response that takes seconds is already eating the 60-second validity budget it is about
    # to hand out, so failing fast is the useful behaviour.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    # ------------------------------------------------------------------- deterministic failure
    # Without `proxy_intercept_errors`, whatever the upstream emits on a fault is passed to the
    # client verbatim - including a Node stack trace, and including a 200 carrying an error
    # body. The re-audit asked for deterministic 429/503; this is the 503 half, and it makes
    # "the signer is not serving" a single machine-readable answer rather than whatever the
    # process happened to print.
    proxy_intercept_errors on;
    error_page 502 503 504 = @signer_unavailable;

    # ------------------------------------------------------------------- response headers
    #
    # HIDE WHAT THE UPSTREAM DECIDED, THEN DECIDE IT HERE. The Node signer sets its own
    # `Cache-Control` and its own `Access-Control-Allow-Origin: *`, and `add_header` APPENDS
    # rather than replaces - so the response went out with `cache-control: no-store` twice and
    # a CORS grant that was nobody's deliberate choice, it was just whatever the process
    # happened to emit. Measured, not assumed: the duplicate was visible in `curl -I`.
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;

    # NEVER cache. A cached signature is an expired signature, and relaying one costs the user
    # gas for a transaction that cannot succeed.
    add_header Cache-Control "no-store" always;

    # The wildcard is KEPT, and now on purpose. These signatures are public by construction -
    # the on-demand design needs any minter to be able to fetch one, and a signature is useless
    # to anyone unwilling to pay the gas to relay it. So there is nothing here to withhold from
    # another origin, and a third party building their own relay UI is a legitimate use. The
    # change is that this is now a decision recorded in the repository rather than a default
    # inherited from an upstream process.
    add_header Access-Control-Allow-Origin "*" always;

    # Re-included on purpose. nginx does not INHERIT add_header into a location that sets any
    # header of its own: the server-level policy would be dropped here entirely and this route
    # would be the one unprotected surface on the site. Found the hard way while installing
    # the header policy; see deploy/nginx/10-security-headers.conf.
    include /etc/nginx/snippets/usecert-security-headers.conf;

    access_log /var/log/nginx/usecert-signer.log usecert_signer;
}

# ------------------------------------------------------------------------ the failure path
# One shape, always, so a client can branch on it without parsing prose. The front end treats
# any non-OK response as "no signature available" and blocks the mint rather than inviting a
# relay that cannot work, which is the behaviour the corrective re-audit asked for - so what
# matters here is that the failure is UNAMBIGUOUS, not that it is decorated.
location @signer_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 5 always;
    include /etc/nginx/snippets/usecert-security-headers.conf;
    return 503 '{"error":"signer_unavailable","attestations":[],"stale":true}';
}
