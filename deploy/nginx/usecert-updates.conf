# Unlisted roadmap update pages: /u/<128-bit token>/, built by deploy/bin/usecert-roadmap-pages.
# Reachable only by their link. Nothing on the site links here, /u/ itself lists nothing, and
# robots are told not to index or archive. The security headers are re-included because an
# add_header in a location drops every server-level one.
location = /u/ { return 404; }
location ^~ /u/ {
    root /var/www;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/usecert-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
