[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
]

# Task 10: `script/DeployTestnet.s.sol` writes the address book `deployments/<chainId>.json`, and
# `vm.writeFile` refuses any path not listed here. Scoped to that ONE directory and nothing else.
#
# This changes NOTHING about compilation: `via_ir` stays false, the optimizer and `optimizer_runs`
# are untouched, and the EIP-170 size check is unaffected. `ffi` is deliberately NOT enabled — the
# deploy script handles three private keys, so it takes the deployed commit from a `COMMIT` env var
# rather than shelling out to `git`.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC}"
